:root{--soft:#e6f0fb;--navy:#014baa;--deep:#2b2e73;--rust:#c93b08;--orange:#f44c10;--sky:#019ce2;--bg:#f4f7fc;--line:#d6e0f0;--ink:#131b2e;--mute:#4a5063;--ok:#0f7a4a;--bad:#b42318}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;font-family:'IBM Plex Sans Arabic',TajawalL,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1180px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);line-height:1.35;text-decoration:none;margin-inline-end:auto}
.brand img{height:46px;width:auto}.brand small{display:block;font-weight:400;color:var(--rust);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.usr{display:flex;align-items:center;gap:10px;font-size:14px}
.lnk{background:none;border:0;color:var(--navy);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:0}
.pill{display:inline-block;background:var(--soft);color:var(--navy);border-radius:99px;padding:1px 12px;font-size:13px;font-weight:600}
main{max-width:1180px;margin:auto;padding:20px 16px 90px}
.hero{background:radial-gradient(120% 90% at 50% 140%,rgba(244,76,16,.5),transparent 62%),linear-gradient(135deg,var(--deep),var(--navy));color:#fff;border-radius:16px;padding:24px 28px 26px;margin-bottom:18px}
.hero.tall{padding-bottom:56px;margin-bottom:0}
.hero h1{margin:0 0 4px;font-size:25px;line-height:1.5}.hero p{margin:0;color:#d3e0fa;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:-34px 18px 18px;position:relative}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(14,58,130,.08);cursor:pointer;font:inherit;text-align:start;width:100%}
.stat:hover{border-color:var(--navy)}.stat.on{border-color:var(--navy);background:var(--soft)}
.stat .si{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:21px;background:var(--soft);flex:none}

async function save(pr){
  const d = draft(), p = P(d.provider_id), errs = validate(d, p); showErrs(errs); if (Object.keys(errs).length) return;
  const b = G(pr ? "s1" : "s0"); document.querySelectorAll("#bt button").forEach(x => x.disabled = true); busy(b, true);
  const free = () => { document.querySelectorAll("#bt button").forEach(x => x.disabled = false); busy(b, false); };
  try {
    let eid = (EMPS.find(e => e.name === d.employee_name) || {}).id || null;
    if (!eid) {
      const a = await modal({title:"اسم غير مدرج في قائمة الموظفين", body:`<p style="margin:0">الاسم «<b>${esc(d.employee_name)}</b>» غير موجود في القائمة. هل تضيفه إليها ليظهر في الاقتراحات لاحقًا؟</p>`,
        foot:`<button class="btn" value="add">نعم، أضفه واحفظ</button><button class="btn alt" value="skip">احفظ دون إضافته</button><button class="btn alt" value="">رجوع</button>`});
      if (!a) return free();
      if (a === "add") { try { const r = await api("/rest/v1/hr_employees", {method:"POST", prefer:"return=representation", body:JSON.stringify({name:d.employee_name})}); eid = r[0].id; EMPS.push(r[0]); } catch (x) { toast("تعذّرت إضافة الاسم: " + msg(x), "bad"); } }
    }
    const rec = await rpc("hr_issue", {p_provider:p.id, p_date:d.date, p_employee_name:d.employee_name, p_employee_id:eid, p_relation:d.relation,
      p_beneficiary:d.beneficiary, p_services:d.services, p_ref:d.ref || null, p_note:d.note || null, p_manual_no:d.manual || null});
    ROWS.unshift(rec); LASTOK = rec; toast(rec.no ? "تم إصدار السند " + rec.no : "تم التسجيل في الأرشيف", "good");
    fI(p.id, d.date); window.scrollTo({top:0, behavior:"smooth"}); if (pr) printRec(rec);
  } catch (x) {
    free(); const m = msg(x);
    if (x.message === "duplicate_no") { G("advd").open = true; toast(m, "bad"); }
    else if (x.message === "duplicate_ref" || x.message === "ref_required") showErrs({f_ref:m});
    else if (x.message !== "انتهت الجلسة.") toast(m, "bad");
  }
}

/* ---------- السجل ---------- */
function filtered(){
  const F = FILT, q = F.q, qe = F.qe;
  return ROWS.filter(r => (!F.pf || r.provider_id === F.pf) && (!F.sf || r.status === F.sf) && (!F.d1 || r.date >= F.d1) && (!F.d2 || r.date <= F.d2) &&
    (!qe || r.employee_name.includes(qe)) && (!q || [r.no, r.beneficiary, r.ref, r.employee_name, (r.services || []).join(" ")].join(" ").includes(q)));
}
function fR(){

  const stat = (s, ic, t) => `<button class="stat${FILT.sf === s ? " on" : ""}" type="button" data-sf="${s}"><span class="si">${ic}</span><span><b>${c(s)}</b><small>${t}</small></span></button>`;
  G("v").innerHTML = hero("سجل الاستفادات", "ابحث وصفِّ واطبع من جديد، أو غيّر حالة السند. اضغط على أي سجل لعرض تفاصيله.", true) +
    `<div class="stats">${stat("", "📋", "كل السجلات")}${stat("issued", "🕓", "صادرة بانتظار العودة")}${stat("done", "✅", "مُنجَزة")}${stat("archived", "🗄️", "مؤرشفة")}${stat("cancelled", "⛔", "ملغاة")}</div>
<div class="toolbar"><input type="search" id="q" placeholder="ابحث بالرقم أو الاسم أو الخدمة أو المرجع" value="${esc(FILT.q)}" aria-label="بحث">${LV !== "reader" ? `<button class="btn alt" type="button" id="bx">⬇ تصدير Excel</button>` : ""}</div>
<details class="adv" ${FILT.pf || FILT.d1 || FILT.d2 || FILT.qe ? "open" : ""}><summary>تصفية متقدمة (الجهة، الفترة، الموظف)</summary><div class="fl" style="margin-top:10px">
<div><label for="pf">الجهة</label><select id="pf"><option value="">كل الجهات</option>${PROV.map(p => `<option value="${p.id}" ${FILT.pf === p.id ? "selected" : ""}>${esc(p.name)}${p.active ? "" : " (غير فعّالة)"}</option>`).join("")}</select></div>
<div><label for="qe">الموظف</label><input id="qe" value="${esc(FILT.qe)}" placeholder="جزء من الاسم"></div>
<div><label for="d1">من تاريخ</label><input type="date" id="d1" value="${FILT.d1}"></div><div><label for="d2">إلى تاريخ</label><input type="date" id="d2" value="${FILT.d2}"></div>
<div style="align-self:end"><button class="btn alt" type="button" id="clr">مسح التصفية</button></div></div></details><div id="tb"></div>`;
  const re = debounce(() => { FILT.n = 60; drawRows(); }, 160);
  G("q").oninput = e => { FILT.q = e.target.value.trim(); re(); };
  ["pf", "qe", "d1", "d2"].forEach(i => { G(i).oninput = G(i).onchange = e => { FILT[i] = e.target.value.trim(); re(); }; });
  G("clr").onclick = () => { FILT = {q:"", qe:"", pf:"", sf:"", d1:"", d2:"", n:60}; fR(); };
  if (G("bx")) G("bx").onclick = () => exportRows(filtered());
  drawRows();
}
function drawRows(){

    shown.map(r => `<tr class="clk" data-id="${r.id}" tabindex="0"><td data-l="الرقم"><span class="num">${esc(r.no) || "—"}</span></td><td data-l="الجهة">${esc(P(r.provider_id).name)}</td><td data-l="الموظف">${esc(r.employee_name)}</td><td data-l="المستفيد">${esc(r.beneficiary)}${r.relation !== rel0() ? ` <small>(${esc(r.relation)})</small>` : ""}</td><td data-l="التاريخ">${fd(r.date)}</td><td data-l="الخدمات">${esc((r.services || []).join("، "))}</td><td data-l="المرجع">${esc(r.ref || "") || "—"}</td><td data-l="الحالة"><span class="tag ${r.status}">${ST[r.status] || r.status}</span></td></tr>`).join("") +
    `</tbody></table></div>` + (rs.length > shown.length ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn alt" type="button" data-a="more">عرض المزيد (${rs.length - shown.length})</button></div>` : "");
}
function actionsFor(r){
  const b = [];
  if (canEdit() && r.no && r.status !== "cancelled") b.push(`<button class="btn" value="pr">🖨️ طباعة السند</button>`);
  if (canEdit() && r.status === "issued") b.push(`<button class="btn" value="done">✔ تأكيد الاستفادة</button>`);
  if (LV === "admin" && r.status !== "cancelled") b.push(`<button class="btn dg" value="cancel">إلغاء السند</button>`);
  if (LV === "admin" && (r.status === "done" || r.status === "cancelled")) b.push(`<button class="btn alt" value="back">تراجع عن الحالة</button>`);
