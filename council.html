<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المجلس التنفيذي — مدرسة تاونزة العلمية</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1F4E8C;--bd:#12335C;--o:#F28C28;--od:#C26A0A;--ol:#FDEBD6;--bl:#E3ECF7;--bg:#F3F6FA;--ink:#1F2937;--mu:#6B7280;--ln:#C9D3E0;--ok:#DDF0E3;--okt:#1E6B3A;--rd:#F8D0CC;--rdt:#9B1C1C;--yl:#FFF4C2;--ylt:#7A5B00;--gr:#E8EAED}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:var(--bd);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--o)}
header b{font-size:1.15rem;font-weight:800;display:block}
header small,.who{font-size:.85rem;opacity:.9}
nav{background:#fff;display:flex;gap:4px;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav a{padding:8px 14px;border-radius:8px;color:var(--bd);text-decoration:none;white-space:nowrap;font-weight:600}
nav a.on{background:var(--b);color:#fff}
main{max-width:880px;margin:0 auto;padding:16px}
h2{margin:8px 0 14px;color:var(--bd);font-weight:800}
.card{background:#fff;border:1px solid var(--ln);border-inline-start:5px solid var(--b);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.mine{border-inline-start-color:var(--o)}
.top,.meta,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top b{color:var(--b);font-size:1.05rem}
.meta{color:var(--mu);font-size:.85rem}
.score{font-weight:800;font-size:1.3rem;color:var(--od);margin-top:6px}
.score small{font-weight:400;color:var(--mu)}
.flag{background:var(--rd);color:var(--rdt);padding:6px 10px;border-radius:6px;font-size:.88rem;margin-top:8px}
.chip{padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--gr);color:#4B5563}
.pending_eval,.partial,.in_progress,.p-medium,.draft{background:var(--yl);color:var(--ylt)}
.ready,.held{background:var(--bl);color:var(--b)}
.scheduled{background:var(--b);color:#fff}
.done,.p-low{background:var(--ok);color:var(--okt)}
.overdue,.p-very_high,.returned{background:var(--rd);color:var(--rdt)}
.p-high{background:var(--ol);color:var(--od)}
.suspended{background:#E4DCF3;color:#4C3A7A}
.btn,button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 18px;background:var(--b);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
.btn.o{background:var(--o);color:#fff}
.btn.g{background:var(--gr);color:var(--ink)}
.link{background:none;color:#fff;text-decoration:underline;padding:0 8px;display:inline}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff}
textarea{min-height:90px}
fieldset{border:1px solid var(--ln);border-radius:10px;margin:12px 0;padding:8px 14px;background:#fff}
legend{font-weight:800;color:var(--bd);padding:0 6px}
fieldset label,.chk label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0}
fieldset input,.chk input{width:auto;margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 12px}
.warn{background:var(--yl);color:var(--ylt);padding:10px 14px;border-radius:8px;margin:0 0 14px}
.err{color:var(--rdt)}.mu{color:var(--mu)}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:24px;border-radius:12px;border-top:5px solid var(--o)}
.login h1{margin:0;color:var(--bd)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{background:var(--b);color:#fff;padding:8px;text-align:start}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
.sc{overflow-x:auto}
details{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;margin:14px 0}
summary{cursor:pointer;font-weight:800;color:var(--bd)}
#toast{position:fixed;bottom:18px;inset-inline:16px;margin:auto;max-width:420px;padding:10px 16px;border-radius:8px;background:var(--bd);color:#fff;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--rdt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--ln);border-top:4px solid var(--o);border-radius:10px;padding:10px 12px;text-align:center}
.kpi.k1{border-top-color:var(--b)}.kpi small{display:block;color:var(--bd);font-weight:600}.kpi b{font-size:1.9rem;color:var(--b)}
.bar{display:grid;grid-template-columns:minmax(110px,1.4fr) 2fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}
.bar i{display:block;height:10px;border-radius:5px;background:var(--b)}.bar b{color:var(--od)}
.card h3{margin:0 0 8px;color:var(--bd)}
.about{background:#fff;border:2px solid var(--ln);border-radius:14px;margin:0 0 20px;overflow:hidden}
.about[open]{border-color:var(--o)}
.about>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px;font-weight:700;font-size:18px;color:var(--bd)}
.about>summary::-webkit-details-marker{display:none}
.about>summary::after{content:"▾";margin-inline-start:auto;font-size:22px;color:var(--o);transition:transform .2s}
.about[open]>summary::after{transform:rotate(180deg)}
.about summary small{display:block;font-weight:400;color:var(--mu);font-size:14px}
.ab-ic{font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--bl);display:grid;place-items:center;flex:none}
.about .gd{padding:0 20px 18px}
.gd details{margin:10px 0}.gd ul,.gd ol{margin:6px 0;padding-inline-start:22px}.gd li{margin:5px 0}.gd p{margin:8px 0}
.gd summary{font-size:1.02rem}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.about>summary{font-size:16px;padding:14px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://vzvkpobtsvofizagiraa.supabase.co',SB_KEY='sb_publishable_H7POoqOnaMziz9IZFMt0fQ_2f0SzbgJ';
const tok=()=>sessionStorage.getItem('twz_tok'),toPlatform=()=>location.replace('index.html#admin');
async function refresh(){const rt=sessionStorage.getItem('twz_rt');if(!rt)return false;
 try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
  if(!r.ok)return false;const j=await r.json();sessionStorage.setItem('twz_tok',j.access_token);sessionStorage.setItem('twz_rt',j.refresh_token||rt);return true}catch{return false}}
const authFetch=async(url,o={})=>{const go=()=>{const h=new Headers(o.headers);h.set('Authorization','Bearer '+tok());return fetch(url,{...o,headers:h})};
 let r=await go();if(r.status===401&&await refresh())r=await go();return r};
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},global:{fetch:authFetch}});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L={
 st:{pending_eval:'بانتظار التقييم',partial:'تم تقييمه جزئيًا',ready:'جاهز للجدولة',postponed:'مؤجَّل',scheduled:'مبرمج في جدول الأعمال',done:'منجز',returned:'أُعيد لصاحبه',closed:'مغلق'},
 dec:{collective:'معالجة جماعية في المجلس',pair:'معالجة ثنائية/ثلاثية',postpone:'تأجيل لدورة قادمة',keep:'حفظ للمتابعة أو إلغاء',review:'يحتاج مراجعة يدوية',rewrite:'إعادة صياغة واستكمال'},
 pr:{very_high:'أولوية مرتفعة جدًا',high:'أولوية مرتفعة',medium:'أولوية متوسطة',low:'أولوية منخفضة',failed:'لم يجتز الفرز'},
 ts:{not_started:'لم يبدأ',in_progress:'قيد التنفيذ',overdue:'متأخر',done:'منجز',suspended:'معلّق',closed:'مغلق'},
 ss:{draft:'مسودة',held:'منعقدة',closed:'مغلقة'}
};
let me=null,cfg=null,members=[];
const MG=()=>!!me&&['ped','gm'].includes(me.role);
function modal(title,body,btns,onPick){
 const d=document.createElement('dialog');d.style.cssText='border:0;border-radius:12px;padding:0;width:min(520px,94vw)';
 d.innerHTML=`<form method="dialog" style="padding:18px"><h3 style="margin:0 0 8px;color:var(--bd)">${title}</h3>${body}<p class="row" style="margin:14px 0 0">${btns.map(b=>`<button class="btn ${b.c||'o'}" value="${b.v}">${b.t}</button>`).join('')}<button class="btn g" value="">تراجع</button></p></form>`;
 document.body.appendChild(d);d.onclose=()=>{if(d.returnValue)onPick(d.returnValue,d);d.remove()};d.showModal();
}
const call=async(n,a)=>{const{data,error}=await sb.rpc(n,a||{});if(error)throw error;return data};
const msg=e=>/denied/.test(e.message)?'هذا الإجراء غير متاح لحسابك.':/draft_has_tasks/.test(e.message)?'المسودة الحالية مرتبطة بتكليفات، فلا يمكن استبدالها.':e.message;
function toast(t,bad){const x=$('#toast');x.textContent=t;x.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='',3500)}
const act=async(fn,ok)=>{try{await fn();toast(ok);render()}catch(e){toast(msg(e),1)}};
const mname=r=>(members.find(m=>m.role===r)||{}).name||r;

async function boot(){
 if(!tok())return toPlatform();
 try{me=await call('cn_me')}catch(e){return toPlatform()}
 if(!me){app.innerHTML='<div class="login"><h1>لا صلاحية</h1><p>حسابك غير مرتبط بعضوية في المجلس التنفيذي.</p><a class="btn" href="index.html#admin">العودة للمنصة</a></div>';return}
 const[{data:s},{data:m}]=await Promise.all([sb.from('cn_settings').select('data').eq('id',1).single(),sb.from('cn_members').select('role,name,position,party').order('sort')]);
 cfg=s.data;members=m;shell();render();
}
function shell(){
 app.innerHTML=`<header><div><b>المجلس التنفيذي</b><small>مدرسة تاونزة العلمية</small></div>
 <div class="who">${esc(me.name)} — ${esc(me.position)}<a class="link" href="index.html#admin">العودة للمنصة</a></div></header>
 <nav>${[['dash','لوحة القيادة'],['issues','الإشكالات'],['new','تدوين إشكال'],['agenda','جدول الأعمال'],['tasks','التكليفات']].concat(MG()?[['settings','الإعدادات']]:[]).map(([k,t])=>`<a data-k="${k}" href="#/${k==='dash'?'':k}">${t}</a>`).join('')}</nav>
 <main>${me.window_open?'':`<p class="warn">نافذة التدوين والتقييم مغلقة حاليًا. تُفتح من اليوم ${me.win_start} من كل شهر إلى اليوم ${me.win_end} من الشهر الموالي.</p>`}<div id="view"></div></main>`;
}
const route=()=>{const[p,a]=location.hash.replace(/^#\/?/,'').split('/');return[p||'dash',decodeURIComponent(a||'')]};
async function render(){
 if(!me)return;const[p,a]=route();
 document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.k===(p==='eval'?'issues':p)));
 const v=$('#view');v.innerHTML='<p class="mu">جارٍ التحميل…</p>';
 try{await({dash:vDash,issues:vIssues,new:vNew,eval:vEval,agenda:vAgenda,tasks:vTasks,settings:vSettings}[p]||vDash)(v,a)}catch(e){v.innerHTML='<p class="err">'+esc(msg(e))+'</p>'}
}
window.addEventListener('hashchange',render);

function guide(){
 const c=cfg,pc=x=>Math.round(x*100),ws=c.win_start,we=c.win_end,
  crit=c.criteria.map((k,i)=>`${esc(k.name)} (${pc(c.weights[i])}%)`).join('، ');
 const S=(t,b,o)=>`<details${o?' open':''}><summary>${t}</summary>${b}</details>`;
 return`<div class="gd">`+
 S('الفكرة العامة',`<p>تنقل المنصة ما يعرقل المؤسسة من حديث متفرّق إلى مسار منظّم: يُدوَّن الإشكال، ويقيّمه أعضاء المجلس بمعايير موحّدة، فيُحسب قراره آليًا، ثم يُعرض في اجتماع المجلس، وتُتابَع تكليفاته حتى الإنجاز.</p><p>الأرقام تُحسب آليًا بلا اجتهاد، أما الاجتهاد فمكانه النقاش في الجلسة. ويُسجَّل كل حدث مهم في سجل التدقيق.</p>`,1)+
 S('الدورة الشهرية',`<ul><li><b>من اليوم ${ws} إلى اليوم ${we} من الشهر الموالي:</b> تدوين الإشكالات وتقييمها. خارج هذه المدة لا يُقبل تدوين ولا تقييم.</li><li><b>من اليوم ${we+1} إلى اليوم ${ws-1}:</b> فترة التحضير: يُولَّد جدول الأعمال ويُنشر.</li><li><b>اليوم ${ws}:</b> اجتماع المجلس.</li><li><b>بعد الاجتماع:</b> تسجيل التكليفات ومتابعتها حتى الإنجاز.</li></ul>`)+
 S('١) تدوين إشكال',`<ul><li>صِغ <b>المشكلة الحقيقية</b> في فقرة واحدة، لا ما يظهر منها ولا سببها ولا نتيجتها. مثال: ليس «تأخّر الأساتذة» بل «ضعف الالتزام بالتوقيت داخل المؤسسة».</li><li>أجب عن ثلاثة أسئلة فرز: هل الإشكال واضح؟ وهل يستند إلى وقائع؟ وهل يمكن تحليله ومتابعته بمؤشرات؟ إن كان أي جواب «لا» يعود الإشكال إلى صاحبه ليستكمله ولا يُعرض للتقييم.</li><li>حدّد <b>الأطراف المعنية</b> كلها، فعددها يحدد مسار المعالجة.</li><li>بعد التسجيل يصل الأعضاء إشعار تيليغرام برابط التقييم.</li></ul>`)+
 S('٢) التقييم',`<ul><li>يقيّم كل عضو كل إشكال مرة واحدة بالمعايير الخمسة: ${crit}. الدرجة من 1 إلى 5 وفق سلّم وصف يظهر في صفحة التقييم.</li><li>لا تمنح الدرجة 4 أو 5 إلا بسند: رقم أو إحصائية أو ملاحظة موثقة، واكتب مبررك في خانة الملاحظة.</li><li>إعادة تقييمك تحدّث تقييمك السابق ولا تضيف تقييمًا جديدًا.</li><li>تقييمات الجميع ظاهرة لكل الأعضاء من زر «تقييمات الجميع» تحت كل إشكال، بأسماء المقيّمين ودرجاتهم وملاحظاتهم.</li><li><b>النصاب ${c.quorum} مقيّمين:</b> قبله لا قرار ولا جدولة. وحين ينقص مقيّم واحد فقط يصل الأعضاء تنبيه.</li></ul>`)+
 S('٣) العلامة والأولوية وتنبيه الجودة',`<p>العلامة من 100 = مجموع (متوسط درجات كل معيار ÷ 5 × وزنه). والأولوية: <b>مرتفعة جدًا</b> من ${c.thr_vh}، و<b>مرتفعة</b> من ${c.thr_h}، و<b>متوسطة</b> من ${c.thr_m}، وما دونها منخفضة.</p><p>يظهر تنبيه <b>«يحتاج نقاشًا قبل الجدولة»</b> إذا بلغ الفارق بين أعلى درجة وأدنى درجة في معيار واحد العتبة المحددة في الإعدادات (حاليًا ${c.variance})، أي أن المقيّمين مختلفون في الحكم، فيُناقش الاختلاف قبل المضي.</p>`)+
 S('٤) القرار الآلي',`<ul><li>علامة ${c.dec_hi} فأكثر وأطراف ${c.col_min} فأكثر: <b>معالجة جماعية في المجلس</b>.</li><li>علامة ${c.dec_lo} فأكثر وأطراف من ${c.pair_min} إلى ${c.pair_max}: <b>معالجة ثنائية/ثلاثية</b> في لقاء مصغّر خارج وقت المجلس.</li><li>علامة بين ${c.dec_lo} و${c.dec_hi} وأطراف ${c.col_min} فأكثر: <b>تأجيل لدورة قادمة</b>، ويعود الإشكال تلقائيًا إلى التنافس على الدورة التالية.</li><li>علامة دون ${c.dec_lo}: <b>حفظ في السجل للمتابعة أو إلغاء</b>.</li><li>ما سوى ذلك: <b>مراجعة يدوية</b>.</li></ul><p>يُحسب القرار تلقائيًا فور بلوغ النصاب، ولا يُعدَّل يدويًا إلا في حالة واحدة: إذا ظهر تنبيه «يحتاج نقاشًا»، فللمدير البيداغوجي والمدير العام، بعد النقاش واتفاق المجلس، اعتماد القرار المتفق عليه، فيصير ملزمًا ولا تغيّره أي تقييمات لاحقة، ويمكن إعادته إلى الحساب الآلي. ولا يُعدَّل قرار إشكال سُجّلت له تكليفات.</p>`)+
 S('٥) جدول الأعمال',`<ul><li>يُولَّد في فترة التحضير من الإشكالات الجاهزة أو المؤجلة التي بلغت النصاب.</li><li>يُختار الأعلى علامة حتى سعة الدورة (حاليًا ${c.capacity})، وعند التساوي الأكثر أطرافًا ثم الأقدم تدوينًا. ولكل إشكال ${c.minutes} دقيقة.</li><li>الإشكالات التي لم تبلغ النصاب تُستبعد وتظهر في رسالة التوليد مع السبب.</li><li>بعد النشر يصل الأعضاء إشعار بالجدول. ويمكن لمسؤولي الدورات إعادة التوليد، وللمتحكمين حذف الجدول عند الحاجة.</li></ul>`)+
 S('٦) تسيير الجلسة',`<p><b>المسار أ، معالجة جماعية (20 إلى 30 دقيقة):</b> الإطار 2 د، ثم مراجعة التقييم 2-3 د، ثم الاستيضاح من صاحب الإشكال 3-5 د، ثم تحليل الأسباب وتوليد الحلول 12 د كحد أقصى، ثم اختيار القرار 3-4 د، ثم تثبيت التكليفات 2-3 د.</p><p class="err"><b>تصعيد إلزامي:</b> إذا تجاوز التحليل وتوليد الحلول 12 دقيقة دون حسم، يتحول الإشكال فورًا إلى المسار ب.</p><p><b>المسار ب، معالجة ثنائية/ثلاثية (5 إلى 8 دقائق):</b> يُعرض الإشكال، ويُعيَّن منسّق ومن يُستدعى من الأطراف المعنية، ويُسجَّل تكليف واحد على الأقل: عقد لقاء مصغّر وعرض نتيجته في الدورة القادمة.</p><p><b>المسار ج، تأجيل أو حفظ (1 إلى 2 دقيقة):</b> إعلان القرار وسببه وتسجيله في المحضر، دون تكليفات.</p>`)+

async function vDash(v){
 const[{data:is,error},{data:ts}]=await Promise.all([sb.from('cn_issues').select('status,priority,decision,domain,score'),sb.from('cn_tasks').select('status')]);
 if(error)throw error;const T0=ts||[];
 const n=(a,f)=>a.filter(f).length,sc=is.map(x=>Number(x.score)).filter(x=>x>0),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10:0;
 const K=[['إجمالي الإشكالات المدوَّنة',is.length],['بانتظار التقييم أو النصاب',n(is,x=>['pending_eval','partial'].includes(x.status))],['قرار نهائي معتمد',n(is,x=>['ready','scheduled','postponed'].includes(x.status))],['متوسط العلامة (من 100)',avg],['مبرمجة في جدول الأعمال',n(is,x=>x.status==='scheduled')],['تكليفات قيد التنفيذ',n(T0,x=>['not_started','in_progress'].includes(x.status))],['تكليفات متأخرة',n(T0,x=>x.status==='overdue')],['تكليفات منجزة',n(T0,x=>x.status==='done')]];
 const tally=(f,lab)=>{const m={};is.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,c])=>[lab&&lab[k]||k,c])};
 const tbl=(t,rows)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return`<section class="card"><h3>${t}</h3>${rows.length?rows.map(([k,c])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round(c/mx*100)}%"></i><b>${c}</b></div>`).join(''):'<p class="mu">لا بيانات بعد.</p>'}</section>`};
 v.innerHTML=`<h2>لوحة القيادة</h2><details class="about"><summary><span class="ab-ic" aria-hidden="true">💡</span><span>ما فكرة منصة الإشكالات؟ تعرّف على طريقة عملها وكيف يعمل المجلس بها<small>اضغط هنا لعرض الشرح المبسّط</small></span></summary>${guide()}</details><div class="kpis">${K.map(([t,x],i)=>`<div class="kpi k${i%2}"><small>${t}</small><b>${x}</b></div>`).join('')}</div>
 <div class="grid2">${tbl('الإشكالات حسب مستوى الأولوية',tally(x=>x.priority,L.pr))}${tbl('القرارات النهائية المعتمدة',tally(x=>x.decision,L.dec))}${tbl('الإشكالات حسب المجال',tally(x=>x.domain))}${tbl('الإشكالات حسب الحالة',tally(x=>x.status,L.st))}</div>`;
}

async function vTasks(v){
 const[{data:ts,error},{data:is}]=await Promise.all([sb.from('cn_tasks').select('*,cn_issues(code)').order('issue_id').order('num'),sb.from('cn_issues').select('code,issue').in('status',['scheduled','done']).in('decision',['collective','pair'])]);
 if(error)throw error;
 const opt=(o,cur)=>Object.entries(o).map(([k,t])=>`<option value="${k}" ${k==cur?'selected':''}>${t}</option>`).join('');
 let h='<h2>التكليفات</h2>'+(ts.length?ts.map(t=>`<article class="card"><div class="top"><b>${esc(t.cn_issues.code)} / T${t.num}</b><span class="chip ${t.status}">${L.ts[t.status]}</span><span class="mu">${esc(mname(t.responsible_role))}</span><span class="mu">الأجل ${t.deadline}</span></div>
  <p>${esc(t.description)}</p>${t.kpi?`<p class="mu">مؤشر النجاح: ${esc(t.kpi)}</p>`:''}
  <div class="grid2"><label>نسبة الإنجاز<select data-t="${t.id}" class="pg">${[0,25,50,75,100].map(n=>`<option ${n==t.progress?'selected':''}>${n}</option>`).join('')}</select></label>
  <label>الحالة<select data-t="${t.id}" class="sx">${opt(L.ts,t.status)}</select></label></div></article>`).join(''):'<p class="mu">لا تكليفات بعد. تُسجَّل التكليفات بعد اتخاذ المجلس قراره في الجلسة.</p>');
 if(me.admin)h+=`<details><summary>إضافة تكليف</summary><form id="f"><label>الإشكال<select id="tc" required>${(is||[]).map(i=>`<option value="${esc(i.code)}">${esc(i.code)}: ${esc(i.issue.slice(0,70))}</option>`).join('')}</select></label>
  <label>وصف التكليف<textarea id="td" required minlength="3"></textarea></label><label>الحل المعتمد للإشكال<textarea id="so"></textarea></label>
  <div class="grid2"><label>المسؤول<select id="tr">${members.map(m=>`<option value="${m.role}">${esc(m.name)}: ${esc(m.position)}</option>`).join('')}</select></label>
  <label>الأجل<input type="date" id="tdl" required></label></div><label>مؤشر النجاح<input id="tk"></label><p><button class="btn o">تسجيل التكليف</button></p></form></details>`;
 v.innerHTML=h;
 v.querySelectorAll('select[data-t]').forEach(s=>s.onchange=()=>{const id=s.dataset.t,p=v.querySelector(`.pg[data-t="${id}"]`).value,st=v.querySelector(`.sx[data-t="${id}"]`).value;
  act(()=>call('cn_update_task',{p_id:Number(id),p_progress:Number(p),p_status:st}),'تم تحديث التكليف')});
 const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();act(()=>call('cn_add_task',{p_code:$('#tc').value,p_desc:$('#td').value.trim(),p_solution:$('#so').value.trim()||null,p_role:$('#tr').value,p_deadline:$('#tdl').value,p_kpi:$('#tk').value.trim()||null}),'سُجّل التكليف وأُشعر المسؤول')};
}
async function vSettings(v){
 if(!MG())throw new Error('الإعدادات متاحة للمدير البيداغوجي والمدير العام فقط.');
 const{data:s}=await sb.from('cn_settings').select('data').eq('id',1).single(),d=s.data;
 const F=[['capacity','سعة الدورة (عدد الإشكالات)'],['minutes','المدة المخصصة لكل إشكال (دقيقة)'],['quorum','النصاب (عدد المقيّمين)'],['variance','عتبة تنبيه التباين (نقاط)'],['thr_vh','عتبة أولوية مرتفعة جدًا'],['thr_h','عتبة أولوية مرتفعة'],['thr_m','عتبة أولوية متوسطة'],['dec_hi','علامة المعالجة الجماعية (فأكثر)'],['dec_lo','علامة المعالجة الثنائية أو التأجيل (فأكثر)'],['col_min','أدنى عدد أطراف للمعالجة الجماعية'],['pair_min','أدنى عدد أطراف للمعالجة الثنائية/الثلاثية'],['pair_max','أقصى عدد أطراف للمعالجة الثنائية/الثلاثية'],['win_start','يوم بداية نافذة التدوين والتقييم'],['win_end','يوم نهاية النافذة (من الشهر الموالي)']];
 v.innerHTML=`<h2>إعدادات الإشكالات</h2><p class="mu">يُطبَّق أي تغيير فورًا، وتُعاد معه حسابات كل الإشكالات.</p><form id="f"><div class="grid2">${F.map(([k,t])=>`<label>${t}<input type="number" min="0" step="1" data-k="${k}" value="${d[k]}" required></label>`).join('')}</div>
 <fieldset><legend>أوزان المعايير (المجموع 100)</legend>${cfg.criteria.map((c,i)=>`<label>${esc(c.name)}<input type="number" min="0" max="100" step="1" data-w="${i}" value="${Math.round(d.weights[i]*100)}" required></label>`).join('')}<p id="ws" class="mu"></p></fieldset>
 <p><button class="btn o">حفظ الإعدادات</button></p></form>`;
 const upd=()=>{const t=[...v.querySelectorAll('[data-w]')].reduce((a,x)=>a+Number(x.value||0),0);$('#ws').textContent='المجموع الحالي: '+t;return t};
 v.querySelectorAll('[data-w]').forEach(x=>x.oninput=upd);upd();
 $('#f').onsubmit=e=>{e.preventDefault();if(upd()!==100)return toast('يجب أن يكون مجموع الأوزان 100.',1);
  const p={};v.querySelectorAll('[data-k]').forEach(x=>p[x.dataset.k]=Number(x.value));p.weights=[...v.querySelectorAll('[data-w]')].map(x=>Number(x.value)/100);
  act(async()=>{await call('cn_save_settings',{p_patch:p});cfg=(await sb.from('cn_settings').select('data').eq('id',1).single()).data.data},'تم حفظ الإعدادات وإعادة حساب الإشكالات')};
}
boot();
</script>
</body>
</html>
